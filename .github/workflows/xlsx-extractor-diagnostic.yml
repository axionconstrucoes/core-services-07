# Diagnostico MANUAL e SOMENTE LEITURA das versoes XLSX da WEG que falharam na extracao.
# Nao grava no banco nem no Storage; nao imprime conteudo de celulas nem nomes de arquivo.
# Sem schedule; somente main. Nenhum cron alterado.
name: XLSX extractor diagnostic (manual, WEG, somente leitura)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Diagnosticar (leitura)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/diagnose-xlsx-versions.mjs
