name: SSMA Notifications

# Aviso de ação corretiva SSMA em atraso e rede de segurança dos registros críticos de campo.
# Fail-closed no servidor: a rota só envia com ACC_SSMA_NOTIFICATIONS_ENABLED=true (variável da Vercel).
# O GitHub Actions NÃO garante pontualidade (atrasos de horas já observados): o aviso de atraso é diário por
# ação/prazo e nunca se repete, então um atraso do agendador apenas adia o aviso.

on:
  # DESATIVADO NO PILOTO: sem gatilho `schedule`. Notificações SSMA automáticas só serão religadas com
  # autorização explícita (reinserir `schedule: - cron: "15 * * * *"` junto com ACC_SSMA_NOTIFICATIONS_ENABLED=true
  # na Vercel). Coleta e processamento dos registros seguem independentes deste workflow.
  workflow_dispatch:

concurrency:
  group: ssma-notifications
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Run SSMA notifications
        env:
          ACC_APP_BASE_URL: ${{ vars.ACC_APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${ACC_APP_BASE_URL:-}" ]; then
            echo "::error::ACC_APP_BASE_URL ausente."
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET ausente."
            exit 1
          fi

          curl --fail-with-body \
            --silent \
            --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${ACC_APP_BASE_URL%/}/api/cron/ssma-notifications"
