name: SSMA Notifications

# Aviso de ação corretiva SSMA em atraso e rede de segurança dos registros críticos de campo.
# Fail-closed no servidor: a rota só envia com ACC_SSMA_NOTIFICATIONS_ENABLED=true (variável da Vercel).
# O GitHub Actions NÃO garante pontualidade (atrasos de horas já observados): o aviso de atraso é diário por
# ação/prazo e nunca se repete, então um atraso do agendador apenas adia o aviso.

on:
  # Religado em 18/11/2026 por autorização explícita, RESTRITO no servidor ao escopo ACC_SSMA_NOTIFICATIONS_SCOPE=WEG_CORRECTIVE_ACTIONS
  # (somente aviso de ação corretiva em atraso da WEG ao responsável + confirmações de resposta). Sem ACC_SSMA_NOTIFICATIONS_ENABLED=true
  # e escopo válido na Vercel, a rota responde 204 e nada é enviado. O aviso de atraso é único por ação/prazo/destinatário.
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prévia sem efeito (escopo WEG_CORRECTIVE_ACTIONS): nada é gravado nem enviado"
        type: boolean
        default: true

concurrency:
  group: ssma-notifications
  cancel-in-progress: false

jobs:
  run:
    # Origem ÚNICA: com o agendador do banco instalado (ACC_SCHEDULER_PG_CRON_ENABLED=true), o pg_cron chama a rota a cada
    # 15 min e este workflow só roda como PRÉVIA manual (dry_run=true).
    if: ${{ vars.ACC_SCHEDULER_PG_CRON_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest

    steps:
      - name: Run SSMA notifications
        env:
          ACC_APP_BASE_URL: ${{ vars.ACC_APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          set -euo pipefail

          if [ -z "${ACC_APP_BASE_URL:-}" ]; then
            echo "::error::ACC_APP_BASE_URL ausente."
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET ausente."
            exit 1
          fi

          # Só 200/204 contam como sucesso: redirecionamento (ex.: para /login), 207 (falha parcial) ou erro falham o job.
          query=""
          if [ "$DRY_RUN" = "1" ]; then query="?dryRun=1"; fi
          code=$(curl --silent --show-error --max-redirs 0 \
            -o "$RUNNER_TEMP/ssma-response.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${ACC_APP_BASE_URL%/}/api/cron/ssma-notifications${query}")
          cat "$RUNNER_TEMP/ssma-response.json" || true
          echo ""
          echo "HTTP ${code}"
          case "$code" in
            200|204) ;;
            *) echo "::error::Resposta inesperada da rota SSMA (HTTP ${code})."; exit 1 ;;
          esac
