name: Contract Alert Batches

on:
  # AGENDADOR UNICO (docs/operacao-workflows-agendador-unico.md): sem `schedule` do GitHub aqui.
  # Quem agenda: Vercel cron /api/cron/weekly-alert-digest (0 10 * * 3), que ja executa runContractAlertBatches(); este workflow fica so manual.
  # Reversao: readicionar o bloco `schedule` removido (ver o doc) SOMENTE com o job do agendador principal desligado.
  workflow_dispatch:

concurrency:
  group: contract-alert-batches
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Run contract alert batches
        env:
          ACC_APP_BASE_URL: ${{ vars.ACC_APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${ACC_APP_BASE_URL:-}" ]; then
            echo "::error::ACC_APP_BASE_URL ausente."
            exit 1
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET ausente."
            exit 1
          fi

          curl --fail-with-body \
            --silent \
            --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${ACC_APP_BASE_URL%/}/api/cron/contract-alert-batches"
